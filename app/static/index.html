<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Marked for markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            chatgpt: {
              sidebar: '#F9F9F9',
              sidebarBorder: '#E5E7EB',
              main: '#FFFFFF',
              userBubble: '#F4F4F4',
              userBubbleHover: '#EBEBEB',
              card: '#F7F7F8',
              cardHover: '#ECECF1',
              input: '#FFFFFF',
              border: '#D1D5DB',
              hover: '#EFEFEF',
              text: '#0D0D0D',
              subtext: '#4B5563',
              grayIcon: '#6B7280',
              accent: '#10A37F'
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #FFFFFF;
      color: #0D0D0D;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 3px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #9CA3AF; }
    
    /* Code blocks in clean dark theme inside light mode - exactly like ChatGPT */
    .prose pre {
      background: #1E1E1E;
      color: #E2E8F0;
      border-radius: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 14px 0;
      border: 1px solid #334155;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.88rem;
      line-height: 1.5;
    }
    .prose pre code {
      background: transparent;
      padding: 0;
      border-radius: 0;
      color: inherit;
      font-size: inherit;
    }
    .prose code {
      background: #F1F5F9;
      color: #0F172A;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.88em;
      border: 1px solid #E2E8F0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .prose table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 0.9em; }
    .prose th, .prose td { border: 1px solid #E5E7EB; padding: 8px 12px; text-align: left; }
    .prose th { background: #F8FAFC; font-weight: 600; color: #0F172A; }
    .prose td { color: #334155; }
    .prose ul { list-style-type: disc; margin-left: 24px; margin-top: 6px; margin-bottom: 6px; }
    .prose ol { list-style-type: decimal; margin-left: 24px; margin-top: 6px; margin-bottom: 6px; }
    .prose p { margin-bottom: 12px; line-height: 1.65; color: #1F2937; }
    .prose h1, .prose h2, .prose h3, .prose h4 { color: #0F172A; font-weight: 600; margin-top: 16px; margin-bottom: 8px; }
    .prose a { color: #10A37F; text-decoration: underline; font-weight: 500; }
    .cursor-blink {
      display: inline-block;
      width: 2px;
      height: 1em;
      background-color: #374151;
      animation: blink 1s infinite;
      vertical-align: middle;
      margin-left: 2px;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Professional SVG Icons without any emojis

    const BoltIcon = () => (

    const WarningIcon = () => (
      <svg stroke="currentColor" fill="none" strokeWidth="1.5" viewBox="0 0 24 24" strokeLinecap="round" strokeLinejoin="round" class="h-6 w-6 mx-auto mb-2 text-gray-700" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg">

    // Official ChatGPT Swirl Icon
    const OpenAIIcon = () => (
      <svg viewBox="0 0 41 41" fill="none" xmlns="http://www.w3.org/2000/svg" width="18" height="18" class="text-white">
        <path d="M37.5324 16.8745C37.9808 15.5241 38.1363 14.0974 37.9886 12.6844C37.8409 11.2713 37.3934 9.90709 36.6748 8.67978C35.9562 7.45247 34.9831 6.39327 33.8164 5.56877C32.6496 4.74427 31.3178 4.17415 29.907 3.89456C28.4962 3.61497 27.0401 3.63254 25.6358 3.94615C24.2315 4.25976 22.9135 4.86193 21.7679 5.71427C20.6224 6.56661 19.6781 7.64821 18.9961 8.88764C18.3141 10.1271 17.9107 11.4947 17.8118 12.9022C16.4828 12.9056 15.1687 13.208 13.9774 13.7844C12.786 14.3608 11.7475 15.1965 10.9464 16.2235C10.1453 17.2505 9.6022 18.4428 9.36151 19.7029C9.12082 20.963 9.18872 22.2596 9.5596 23.4871C8.21666 23.9535 7.00949 24.7448 6.03554 25.7972C5.06159 26.8496 4.34689 28.1363 3.94966 29.5534C3.55243 30.9705 3.48293 32.4816 3.74693 33.963C4.01093 35.4444 4.59196 36.8582 5.44284 38.0894C6.29372 39.3206 7.39235 40.3379 8.64947 41.0583C9.90659 41.7787 11.2917 42.1843 12.6917 42.242C14.0917 42.2997 15.4719 42.0081 16.72 41.391C17.9681 40.7739 19.0537 39.8466 19.8874 38.6853C20.4072 39.0665 20.9781 39.3804 21.5873 39.6201C22.1966 39.8598 22.8315 40.0204 23.4776 40.0984C24.1237 40.1764 24.7677 40.1702 25.3952 40.08C26.0227 39.9898 26.6208 39.8174 27.1755 39.5667C26.7271 40.9171 26.5716 42.3438 26.7193 43.7568C26.867 45.1699 27.3145 46.5341 28.0331 47.7614C28.7517 48.9887 29.7248 50.0479 30.8916 50.8724C32.0584 51.6969 33.3902 52.267 34.801 52.5466C36.2118 52.8262 37.6679 52.8087 39.0722 52.4951C40.4765 52.1815 41.7945 51.5793 42.9401 50.727C44.0856 49.8746 45.0299 48.793 45.7119 47.5536C46.3939 46.3141 46.7973 44.9465 46.8962 43.539C48.2252 43.5356 49.5393 43.2332 50.7306 42.6568C51.922 42.0804 52.9605 41.2447 53.7616 40.2177C54.5627 39.1907 55.1058 37.9984 55.3465 36.7383C55.5872 35.4782 55.5193 34.1816 55.1484 32.9541C56.4913 32.4877 57.6985 31.6964 58.6725 30.644C59.6464 29.5916 60.3611 28.3049 60.7583 26.8878C61.1556 25.4707 61.2251 23.9596 60.9611 22.4782C60.6971 20.9968 60.116 19.583 59.2652 18.3518C58.4143 17.1206 57.3156 16.1033 56.0585 15.3829C54.8014 14.6625 53.41       </svg>
    );

    const UserAvatar = ({ email }) => (
      <div class="w-7 h-7 rounded-full overflow-hidden flex items-center justify-center font-semibold text-xs shrink-0 select-none bg-indigo-600 text-white shadow-sm">
        {email ? email.charAt(0).toUpperCase() : 'R'}
      </div>
    );

    const AssistantAvatar = () => (
      <div class="w-7 h-7 rounded-sm bg-[#10A37F] text-white flex items-center justify-center font-bold text-xs shrink-0 shadow-sm select-none">
        <OpenAIIcon />
      </div>
    );

    // Initial conversation history
    const DEFAULT_HISTORY = [
      { id: "mock_today_1", title: "New chat", section: "Today" },
      { id: "mock_p30_1", title: "Tech & UX Trends", section: "Previous 30 Days" },
      { id: "mock_p30_2", title: "Repas molle et rapide.", section: "Previous 30 Days" },
      { id: "mock_p30_3", title: "Extend D-ticket to France", section: "Previous 30 Days" },
      { id: "mock_p30_4", title: "Bubble.io App Specialist", section: "Previous 30 Days" },
      { id: "mock_p30_5", title: "Excel Expert Assistance", section: "Previous 30 Days" },
      { id: "mock_p30_6", title: "Designing Android Apps in Fig", section: "Previous 30 Days" },
      { id: "mock_p30_7", title: "Formation Program Assistance.", section: "Previous 30 Days" },
    ];

    function App() {
      const [userEmail, setUserEmail] = useState("reda.attarca@gmail.com");
      const [userId, setUserId] = useState("default_user");
      const [conversations, setConversations] = useState([]);
      const [activeConvId, setActiveConvId] = useState("");
      const [activeConvTitle, setActiveConvTitle] = useState("");
      const [messages, setMessages] = useState([]);
      const [inputQuery, setInputQuery] = useState("");
      const [isLoading, setIsLoading] = useState(false);
      const [showModal, setShowModal] = useState(false);
      const [activeModalTab, setActiveModalTab] = useState("documents");
      const [memories, setMemories] = useState([]);
      const [newMemContent, setNewMemContent] = useState("");
      const [newMemCategory, setNewMemCategory] = useState("explicit_notes");
      const [newMemImp, setNewMemImp] = useState(3);
      const [copiedIndex, setCopiedIndex] = useState(null);

      // File upload states
      const [attachedFile, setAttachedFile] = useState(null);
      const [isUploading, setIsUploading] = useState(false);
      const [uploadSuccessMsg, setUploadSuccessMsg] = useState("");
      const [uploadedDocs, setUploadedDocs] = useState([]);
      const fileInputRef = useRef(null);
      const modalFileInputRef = useRef(null);
      const messagesEndRef = useRef(null);

      // Load conversations from DB
      const loadConversations = async () => {
        try {
          const res = await fetch(`/api/conversations?user_id=${userId}`);
          if (res.ok) {
            const data = await res.json();
            if (data && data.length > 0) {
              setConversations(data);
            } else {
              setConversations(DEFAULT_HISTORY);
            }
          } else {
            setConversations(DEFAULT_HISTORY);
          }
        } catch (e) {
          setConversations(DEFAULT_HISTORY);
        }
      };

      // Load messages for active conversation
      const loadMessages = async (cid) => {
        if (!cid || cid.startsWith("mock_")) {
          setMessages([]);
          return;
        }
        try {
          const res = await fetch(`/api/conversations/${cid}?user_id=${userId}`);
          if (res.ok) {
            const data = await res.json();
            setMessages(data.messages || []);
          } else {
            setMessages([]);
          }
        } catch (e) {
          setMessages([]);
        }
      };

      // Load long-term memories
      const loadMemories = async () => {
        try {
          const res = await fetch(`/api/memory?user_id=${userId}`);
          if (res.ok) {
            const data = await res.json();
            setMemories(data);
          }
        } catch (e) {}
      };

      // Load uploaded documents
      const loadUploadedDocs = async () => {
        try {
          const res = await fetch(`/api/documents?user_id=${userId}`);
          if (res.ok) {
            const data = await res.json();
            setUploadedDocs(data);
          }
        } catch (e) {}
      };

      useEffect(() => {
        loadConversations();
        loadMemories();
        loadUploadedDocs();
      }, [userId]);

      useEffect(() => {
        if (activeConvId) {
          loadMessages(activeConvId);
        } else {
          setMessages([]);
        }
      }, [activeConvId]);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages, isLoading, isUploading]);

      const handleNewChat = () => {
        const newId = `session_${Math.random().toString(36).substring(2, 10)}`;
        setActiveConvId(newId);
        setActiveConvTitle("New chat");
        setMessages([]);
        setAttachedFile(null);
      };

      const selectConversation = (item) => {
        setActiveConvId(item.id);
        setActiveConvTitle(item.title);
        if (item.id.startsWith("mock_")) {
          setMessages([]);
        } else {
          loadMessages(item.id);
        }
      };

      const handleDeleteChat = async (e, cid) => {
        e.stopPropagation();
        if (cid.startsWith("mock_")) {
          setConversations(prev => prev.filter(c => c.id !== cid));
          if (activeConvId === cid) handleNewChat();
          return;
        }
        try {
          await fetch(`/api/conversations/${cid}?user_id=${userId}`, { method: "DELETE" });
          await loadConversations();
          if (activeConvId === cid) handleNewChat();
        } catch (e) {}
      };

      // File upload handler
      const handleFileUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        setAttachedFile(file);
        setIsUploading(true);
        setUploadSuccessMsg("");

        const formData = new FormData();
        formData.append("file", file);
        formData.append("user_id", userId);

        try {
          const res = await fetch("/api/upload", {
            method: "POST",
            body: formData
          });

          if (res.ok) {
            const data = await res.json();
            setUploadSuccessMsg(`${data.chunks_stored} chunks indexed`);
            loadUploadedDocs();

            // Add notification to current chat stream
            const asstMsg = {
              role: "assistant",
              content: `**Document Ingested into Knowledge Base**\n\n- File: \`${file.name}\`\n- Size: ${(file.size / 1024).toFixed(1)} KB\n- Chunks Created: ${data.chunks_stored} vector embeddings indexed in Qdrant.\n\nYou can now ask questions about the contents of this document.`,
              created_at: new Date().toISOString(),
              metadata: {
                category: "DOCUMENT_INGESTION",
                agents_used: ["rag_agent"]
              }
            };
            setMessages(prev => [...prev, asstMsg]);
          } else {
            const err = await res.json().catch(() => ({}));
            alert(`Upload failed: ${err.detail || "Unable to ingest document"}`);
            setAttachedFile(null);
          }
        } catch (err) {
          alert("Network error uploading file.");
          setAttachedFile(null);
        } finally {
          setIsUploading(false);
          if (fileInputRef.current) fileInputRef.current.value = "";
          if (modalFileInputRef.current) modalFileInputRef.current.value = "";
        }
      };

      const handleDeleteDoc = async (docId) => {
        try {
          await fetch(`/api/documents/${docId}?user_id=${userId}`, { method: "DELETE" });
          loadUploadedDocs();
        } catch (e) {}
      };

      const handleSend = async (customText) => {
        const text = (typeof customText === 'string' ? customText : inputQuery).trim();
        if (!text || isLoading) return;

        setInputQuery("");
        const cid = (!activeConvId || activeConvId.startsWith("mock_")) 
          ? `session_${Math.random().toString(36).substring(2, 10)}` 
          : activeConvId;
        
        if (activeConvId !== cid) {
          setActiveConvId(cid);
          setActiveConvTitle(text.substring(0, 24));
        }

        // Optimistically add user query (Right side)
        const optimisticUserMsg = { role: "user", content: text, created_at: new Date().toISOString() };
        setMessages(prev => [...prev, optimisticUserMsg]);
        setIsLoading(true);

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              query: text,
              conversation_id: cid,
              user_id: userId
            })
          });

          if (res.ok) {
            const data = await res.json();
            const asstMsg = {
              role: "assistant",
              content: data.final_response,
              created_at: new Date().toISOString(),
              metadata: {
                category: data.query_category,
                agents_used: data.selected_agents,
                citations: data.source_references
              }
            };
            setMessages(prev => [...prev, asstMsg]);
            loadConversations();
            loadMemories();
          } else {
            const errData = await res.json().catch(() => ({}));
            setMessages(prev => [...prev, {
              role: "assistant",
              content: `Error: ${errData.detail || "Unable to process request. Please try again."}`
            }]);
          }
        } catch (err) {
          setMessages(prev => [...prev, {
            role: "assistant",
            content: "Network error communicating with LangGraph multi-agent server."
          }]);
        } finally {
          setIsLoading(false);
        }
      };

      const copyToClipboard = (text, idx) => {
        navigator.clipboard.writeText(text);
        setCopiedIndex(idx);

                          </div>
                        )}
                      </div>
                    </div>
                  )}

                  {/* TAB 2: Long-Term Memory */}
                  {activeModalTab === "memory" && (
                    <div class="space-y-4">
                      {/* Explicit Memory Form */}
                      <form onSubmit={handleSaveMemory} class="bg-gray-50 border border-gray-200 rounded-lg p-3 space-y-3">
                        <div class="font-semibold text-xs text-gray-900">Save Explicit Memory</div>
                        <div class="grid grid-cols-2 gap-2">
                          <div>
                            <label class="text-[10px] text-gray-600">Category</label>
                            <select
                              value={newMemCategory}
                              onChange={(e) => setNewMemCategory(e.target.value)}
                              class="w-full bg-white border border-gray-300 rounded px-2 py-1.5 text-xs text-gray-900 mt-0.5 focus:outline-none"
                            >
                              <option value="user_preferences">User Preferences</option>
                              <option value="user_context">User Context</option>
                              <option value="project_context">Project Context</option>
                              <option value="research_memory">Research Memory</option>
                              <option value="explicit_notes">Explicit Notes</option>
                            </select>
                          </div>
                          <div>
                            <label class="text-[10px] text-gray-600">Importance (1-5)</label>
                            <input
                              type="number"
                              min="1"
                              max="5"
                              value={newMemImp}
                              onChange={(e) => setNewMemImp(e.target.value)}
                              class="w-full bg-white border border-gray-300 rounded px-2 py-1.5 text-xs text-gray-900 mt-0.5 focus:outline-none"
                            />
                          </div>
                        </div>
                        <div>
                          <label class="text-[10px] text-gray-600">Content (No passwords or API keys)</label>
                          <textarea
                            rows="2"
                            placeholder="e.g. User prefers concise answers with code snippets in Python."
                            value={newMemContent}
                            onChange={(e) => setNewMemContent(e.target.value)}
                            class="w-full bg-white border border-gray-300 rounded px-2.5 py-1.5 text-xs text-gray-900 mt-0.5 focus:outline-none focus:border-gray-500"
                          />
                        </div>
                        <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3.5 py-1.5 rounded font-medium transition shadow-sm">
                          Save Memory
                        </button>
                      </form>

                      {/* Stored Memories List */}
                      <div class="space-y-2">
                        <div class="font-semibold text-xs text-gray-700">Active Long-Term Memories ({memories.length})</div>
                        {memories.map(mem => (
                          <div key={mem.id} class="bg-gray-50 border border-gray-200 rounded-lg p-3 flex items-start justify-between">
                            <div class="space-y-1 pr-2">
                              <div class="flex items-center gap-2">
                                <span class="text-[10px] bg-amber-50 text-amber-700 border border-amber-200 px-2 py-0.5 rounded font-medium">
                                  {mem.category.replace('_', ' ').toUpperCase()}
                                </span>
                                <span class="text-[10px] text-gray-500">Importance: {mem.importance}/5</span>
                              </div>
                              <div class="text-xs text-gray-800">{mem.content}</div>
                            </div>
                            <button
                              onClick={() => handleDeleteMemory(mem.id)}
                              class="text-gray-400 hover:text-red-600 text-xs px-2 py-1 rounded transition"
                            >
                              ✕
                            </button>
                          </div>
                        ))}
                        {memories.length === 0 && (
                          <div class="text-xs text-gray-500 italic p-4 text-center border border-dashed border-gray-200 rounded-lg">
                            No persistent memories yet. The system automatically extracts key preferences, or you can add them above.
                          </div>
                        )}
                      </div>
                    </div>
                  )}

                  {/* TAB 3: Multi-Agent System */}
                  {activeModalTab === "agents" && (
                    <div class="space-y-3 text-xs">
                      <div class="p-3 bg-gray-50 border border-gray-200 rounded-lg space-y-2">
                        <div class="font-semibold text-gray-900">LangGraph Orchestration Pipeline</div>
                        <p class="text-gray-600 text-[11px] leading-relaxed">
                          Incoming queries are routed by the Supervisor node to specialized agents via conditional StateGraph routing and merged into shared state.
                        </p>
                      </div>
                      <div class="grid grid-cols-2 gap-2">
                        <div class="p-3 bg-gray-50 border border-gray-200 rounded-lg">
                          <div class="font-semibold text-gray-900">1. Supervisor Agent</div>
                          <div class="text-[11px] text-gray-600">Intent detection and parallel dispatch</div>
                        </div>
                        <div class="p-3 bg-gray-50 border border-gray-200 rounded-lg">
                          <div class="font-semibold text-gray-900">2. RAG Agent</div>
                          <div class="text-[11px] text-gray-600">Qdrant Cloud vector search and FlashRank reranker</div>
                        </div>
                        <div class="p-3 bg-gray-50 border border-gray-200 rounded-lg">
                          <div class="font-semibold text-gray-900">3. Web Search Agent</div>
                          <div class="text-[11px] text-gray-600">Tavily Search API and DuckDuckGo fallback</div>
                        </div>
                        <div class="p-3 bg-gray-50 border border-gray-200 rounded-lg">
                          <div class="font-semibold text-gray-900">4. Research Agent</div>
                          <div class="text-[11px] text-gray-600">Evidence synthesis and multi-source cross-check</div>
                        </div>
                        <div class="p-3 bg-gray-50 border border-gray-200 rounded-lg">
                          <div class="font-semibold text-gray-900">5. Tool Agent</div>
                          <div class="text-[11px] text-gray-600">Calculator, Python executor, and date utilities</div>
                        </div>
                        <div class="p-3 bg-gray-50 border border-gray-200 rounded-lg">
                          <div class="font-semibold text-gray-900">6. Response Agent</div>
                          <div class="text-[11px] text-gray-600">Grounded synthesis with verified citations</div>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* TAB 4: User & Profile */}
                  {activeModalTab === "user" && (
                    <div class="space-y-4 text-xs">
                      <div class="p-3 bg-gray-50 border border-gray-200 rounded-lg space-y-3">
                        <div class="font-semibold text-gray-900">User Identification & Isolation</div>
                        <div>
                          <label class="text-[10px] text-gray-600">Display Email</label>
                          <input
                            type="text"
                            value={userEmail}
                            onChange={(e) => setUserEmail(e.target.value)}
                            class="w-full bg-white border border-gray-300 rounded px-2.5 py-1.5 text-xs text-gray-900 mt-1"
                          />
                        </div>
                        <div>
                          <label class="text-[10px] text-gray-600">Database User ID (Isolation key)</label>
                          <input
                            type="text"
                            value={userId}
                            onChange={(e) => setUserId(e.target.value)}
                            class="w-full bg-white border border-gray-300 rounded px-2.5 py-1.5 text-xs text-gray-900 mt-1"
                          />
                        </div>
                      </div>
                      <div class="p-3 bg-gray-50 border border-gray-200 rounded-lg space-y-2">
                        <div class="font-semibold text-gray-900">Data Retention & Control</div>
                        <p class="text-gray-600 text-[11px]">
                          All messages, documents, and memories are stored locally in SQLite (`processed_data/memory.db`) or PostgreSQL (`DATABASE_URL`). You can delete individual memories or chats anytime.
                        </p>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
