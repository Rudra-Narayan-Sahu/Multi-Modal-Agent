    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; }

    .custom-scrollbar-light::-webkit-scrollbar-thumb:hover { background: #9CA3AF; }
    
    /* Code blocks styling - unadorned, high contrast, clean monospace, no emoji stickers */
    .prose pre {
      background: #1E1E1E !important;
      color: #E2E8F0 !important;
      border-radius: 6px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 12px 0;
      border: 1px solid #334155;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.88rem;
      line-height: 1.5;
    }
    .prose pre code {
      background: transparent !important;
      padding: 0 !important;
      border-radius: 0 !important;
      color: inherit !important;
      font-size: inherit !important;
    }
    .prose-dark code {
      background: #2D3748;
      color: #F7FAFC;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.88em;
      border: 1px solid #4A5568;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .prose-light code {
      background: #F1F5F9;
      color: #0F172A;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.88em;
      border: 1px solid #E2E8F0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .prose table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 0.9em; }
    .prose-dark th, .prose-dark td { border: 1px solid #4B5563; padding: 8px 12px; text-align: left; }
    .prose-dark th { background: #2A2B32; font-weight: 600; color: #ECECF1; }
    .prose-dark td { color: #D1D5DB; }
    .prose-light th, .prose-light td { border: 1px solid #E5E7EB; padding: 8px 12px; text-align: left; }
    .prose-light th { background: #F8FAFC; font-weight: 600; color: #0F172A; }
    .prose-light td { color: #334155; }
    .prose ul { list-style-type: disc; margin-left: 24px; margin-top: 6px; margin-bottom: 6px; }
    .prose ol { list-style-type: decimal; margin-left: 24px; margin-top: 6px; margin-bottom: 6px; }
    .prose p { margin-bottom: 12px; line-height: 1.65; }
    .prose-dark p { color: #ECECF1; }
    .prose-light p { color: #1F2937; }
    .prose-dark h1, .prose-dark h2, .prose-dark h3, .prose-dark h4 { color: #FFFFFF; font-weight: 600; margin-top: 16px; margin-bottom: 8px; }
    .prose-light h1, .prose-light h2, .prose-light h3, .prose-light h4 { color: #0F172A; font-weight: 600; margin-top: 16px; margin-bottom: 8px; }
    .prose a { color: #10A37F; text-decoration: underline; font-weight: 500; }
    .cursor-blink {
      display: inline-block;
      width: 2px;
      height: 1em;
      background-color: currentColor;
      animation: blink 1s infinite;
      vertical-align: middle;
      margin-left: 2px;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body class="h-screen flex overflow-hidden select-none">

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Configure marked for clean code blocks with copy bar and zero emojis
    const renderer = new marked.Renderer();
    renderer.code = function(code, language) {
      const lang = (language || 'code').trim();
      const cleanLang = lang.replace(/[\u{1F300}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '').trim() || 'code';
      const escapedCode = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return `
        <div class="my-3 rounded-md overflow-hidden border border-gray-700/60 bg-[#1E1E1E]">
          <div class="flex justify-between items-center px-4 py-1.5 bg-[#2F3136] text-xs text-gray-300 font-mono select-none">
            <span class="lowercase font-medium text-gray-300">${cleanLang}</span>
            <button onclick="navigator.clipboard.writeText(decodeURIComponent('${encodeURIComponent(code)}')); this.innerText='Copied!'; setTimeout(() => this.innerText='Copy code', 2000);" class="hover:text-white transition flex items-center gap-1.5 text-xs text-gray-300">
              <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="12" width="12"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              Copy code
            </button>
          </div>
          <pre class="p-4 overflow-x-auto text-sm text-[#E2E8F0] font-mono leading-relaxed" style="background:#1E1E1E !important; margin:0 !important; border:none !important;"><code>${escapedCode}</code></pre>
        </div>
      `;
    };
    marked.setOptions({ renderer });

      </svg>
    );

    const UserAvatar = ({ email }) => (
      <div class="w-7 h-7 rounded-sm overflow-hidden flex items-center justify-center font-bold text-xs shrink-0 select-none bg-[#7C3AED] text-white shadow-sm">
        {email ? email.charAt(0).toUpperCase() : 'R'}
      </div>
    );

    const AssistantAvatar = () => (
      <div class="w-7 h-7 rounded-sm bg-[#10A37F] text-white flex items-center justify-center font-bold text-xs shrink-0 shadow-sm select-none">
        <OpenAIIcon />
      </div>
    );

    // Initial conversation history matching reference image
    const DEFAULT_HISTORY = [
      { id: "mock_today_1", title: "New chat", section: "Today" },
      { id: "mock_p30_1", title: "Tech & UX Trends", section: "Previous 30 Days" },
      { id: "mock_p30_2", title: "Repas molle et rapide.", section: "Previous 30 Days" },
      { id: "mock_p30_3", title: "Extend D-ticket to France", section: "Previous 30 Days" },
      { id: "mock_p30_4", title: "Bubble.io App Specialist", section: "Previous 30 Days" },
      { id: "mock_p30_5", title: "Excel Expert Assistance", section: "Previous 30 Days" },
      { id: "mock_p30_6", title: "Designing Android Apps in Fig", section: "Previous 30 Days" },
      { id: "mock_p30_7", title: "Formation Program Assistance.", section: "Previous 30 Days" },
    ];

    function App() {
      // Default theme is DARK matching the uploaded screenshot
      const [theme, setTheme] = useState(() => localStorage.getItem("chatgpt_theme") || "dark");
      const [userEmail, setUserEmail] = useState("reda.attarca@gmail.com");
      const [userId, setUserId] = useState("default_user");
      const [conversations, setConversations] = useState([]);
      const [activeConvId, setActiveConvId] = useState("");
      const [activeConvTitle, setActiveConvTitle] = useState("");
      const [messages, setMessages] = useState([]);
      const [inputQuery, setInputQuery] = useState("");
      const [isLoading, setIsLoading] = useState(false);
      const [showModal, setShowModal] = useState(false);
      const [activeModalTab, setActiveModalTab] = useState("documents");
      const [memories, setMemories] = useState([]);
      const [newMemContent, setNewMemContent] = useState("");
      const [newMemCategory, setNewMemCategory] = useState("explicit_notes");
      const [newMemImp, setNewMemImp] = useState(3);
      const [copiedIndex, setCopiedIndex] = useState(null);

      // File upload states
      const [attachedFile, setAttachedFile] = useState(null);
      const [isUploading, setIsUploading] = useState(false);
      const [uploadSuccessMsg, setUploadSuccessMsg] = useState("");
      const [uploadedDocs, setUploadedDocs] = useState([]);
      const fileInputRef = useRef(null);
      const modalFileInputRef = useRef(null);
      const messagesEndRef = useRef(null);

      const isDark = theme === "dark";

      const toggleTheme = () => {
        const nextTheme = isDark ? "light" : "dark";
        setTheme(nextTheme);
        localStorage.setItem("chatgpt_theme", nextTheme);
      };

      // Load conversations from DB
      const loadConversations = async () => {
        try {
          const res = await fetch(`/api/conversations?user_id=${userId}`);
          if (res.ok) {
            const data = await res.json();
            if (data && data.length > 0) {
              setConversations(data);
            } else {
              setConversations(DEFAULT_HISTORY);
            }
          } else {
            setConversations(DEFAULT_HISTORY);
          }
        } catch (e) {
          setConversations(DEFAULT_HISTORY);
        }
      };

      // Load messages for active conversation
      const loadMessages = async (cid) => {
        if (!cid || cid.startsWith("mock_")) {
          setMessages([]);
          return;
        }
        try {
          const res = await fetch(`/api/conversations/${cid}?user_id=${userId}`);
          if (res.ok) {
            const data = await res.json();
            setMessages(data.messages || []);
          } else {
            setMessages([]);
          }
        } catch (e) {
          setMessages([]);
        }
      };

      // Load long-term memories
      const loadMemories = async () => {
        try {
          const res = await fetch(`/api/memory?user_id=${userId}`);
          if (res.ok) {
            const data = await res.json();
            setMemories(data);
          }
        } catch (e) {}
      };

      // Load uploaded documents
      const loadUploadedDocs = async () => {
        try {
          const res = await fetch(`/api/documents?user_id=${userId}`);
          if (res.ok) {
            const data = await res.json();
            setUploadedDocs(data);
          }
        } catch (e) {}
      };

      useEffect(() => {
        loadConversations();
        loadMemories();
        loadUploadedDocs();
      }, [userId]);

      useEffect(() => {
        if (activeConvId) {
          loadMessages(activeConvId);
        } else {
          setMessages([]);
        }
      }, [activeConvId]);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages, isLoading, isUploading]);

      const handleNewChat = () => {
        const newId = `session_${Math.random().toString(36).substring(2, 10)}`;
        setActiveConvId(newId);
        setActiveConvTitle("New chat");
        setMessages([]);
        setAttachedFile(null);
      };

      const selectConversation = (item) => {
        setActiveConvId(item.id);
        setActiveConvTitle(item.title);
        if (item.id.startsWith("mock_")) {
          setMessages([]);
        } else {
          loadMessages(item.id);
        }
      };

      const handleDeleteChat = async (e, cid) => {
        e.stopPropagation();
        if (cid.startsWith("mock_")) {
          setConversations(prev => prev.filter(c => c.id !== cid));
          if (activeConvId === cid) handleNewChat();
          return;
        }
        try {
          await fetch(`/api/conversations/${cid}?user_id=${userId}`, { method: "DELETE" });
          await loadConversations();
          if (activeConvId === cid) handleNewChat();
        } catch (e) {}
      };

      // File upload handler
      const handleFileUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        setAttachedFile(file);
        setIsUploading(true);
        setUploadSuccessMsg("");

        const formData = new FormData();
        formData.append("file", file);
        formData.append("user_id", userId);

        try {
          const res = await fetch("/api/upload", {
            method: "POST",
            body: formData
          });

          if (res.ok) {
            const data = await res.json();
            setUploadSuccessMsg(`${data.chunks_stored} chunks indexed`);
            loadUploadedDocs();

            // Add notification to current chat stream
            const asstMsg = {
              role: "assistant",
              content: `**Document Ingested into Knowledge Base**\n\n- File: \`${file.name}\`\n- Size: ${(file.size / 1024).toFixed(1)} KB\n- Chunks Created: ${data.chunks_stored} vector embeddings indexed in Qdrant.\n\nYou can now ask questions about the contents of this document.`,
              created_at: new Date().toISOString(),
              metadata: {
                category: "DOCUMENT_INGESTION",
                agents_used: ["rag_agent"]
              }
            };
            setMessages(prev => [...prev, asstMsg]);
          } else {
            const err = await res.json().catch(() => ({}));
            alert(`Upload failed: ${err.detail || "Unable to ingest document"}`);
            setAttachedFile(null);
          }
        } catch (err) {
          alert("Network error uploading file.");
          setAttachedFile(null);
        } finally {
          setIsUploading(false);
          if (fileInputRef.current) fileInputRef.current.value = "";
          if (modalFileInputRef.current) modalFileInputRef.current.value = "";
        }
      };

      const handleDeleteDoc = async (docId) => {
        try {
          await fetch(`/api/documents/${docId}?user_id=${userId}`, { method: "DELETE" });
          loadUploadedDocs();
        } catch (e) {}
      };

      const handleSend = async (customText) => {
        const text = (typeof customText === 'string' ? customText : inputQuery).trim();
        if (!text || isLoading) return;

        setInputQuery("");
        const cid = (!activeConvId || activeConvId.startsWith("mock_")) 
          ? `session_${Math.random().toString(36).substring(2, 10)}` 
          : activeConvId;
        
        if (activeConvId !== cid) {
          setActiveConvId(cid);
          setActiveConvTitle(text.substring(0, 24));
        }

        // Optimistically add user query (Right side bubble)
        const optimisticUserMsg = { role: "user", content: text, created_at: new Date().toISOString() };
        setMessages(prev => [...prev, optimisticUserMsg]);
        setIsLoading(true);

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              query: text,
              conversation_id: cid,
              user_id: userId
            })
          });

          if (res.ok) {
            const data = await res.json();
            const asstMsg = {
              role: "assistant",
              content: data.final_response,
              created_at: new Date().toISOString(),
              metadata: {
                category: data.query_category,
                agents_used: data.selected_agents,
                citations: data.source_references
              }
            };
            setMessages(prev => [...prev, asstMsg]);
            loadConversations();
            loadMemories();
          } else {
            const errData = await res.json().catch(() => ({}));
            setMessages(prev => [...prev, {
              role: "assistant",
              content: `Error: ${errData.detail || "Unable to process request. Please try again."}`
            }]);
          }
        } catch (err) {
          setMessages(prev => [...prev, {
            role: "assistant",
            content: "Network error communicating with LangGraph multi-agent server."
          }]);
        } finally {
          setIsLoading(false);
        }
      };

      const copyToClipboard = (text, idx) => {
        navigator.clipboard.writeText(text);
        setCopiedIndex(idx);
        setTimeout(() => setCopiedIndex(null), 2000);
      };

      const handleSaveMemory = async (e) => {
        e.preventDefault();
        if (!newMemContent.trim()) return;
        try {
          const res = await fetch(`/api/memory?user_id=${userId}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              content: newMemContent.trim(),
              category: newMemCategory,
              importance: parseInt(newMemImp)
            })
          });
          if (res.ok) {
            setNewMemContent("");
            loadMemories();
          }
        } catch (e) {}
      };

      const handleDeleteMemory = async (mid) => {
        try {
          await fetch(`/api/memory/${mid}?user_id=${userId}`, { method: "DELETE" });
          loadMemories();
        } catch (e) {}
      };

      // Split chats into Today and Previous 30 Days
      const todayChats = conversations.filter(c => c.section === "Today" || (!c.section && conversations.indexOf(c) < 1));
      const previousChats = conversations.filter(c => c.section === "Previous 30 Days" || (!c.section && conversations.indexOf(c) >= 1));

      return (
        <div class={`flex h-full w-full overflow-hidden text-sm ${isDark ? 'bg-chatgpt-darkCanvas text-chatgpt-darkText' : 'bg-chatgpt-lightCanvas text-chatgpt-lightText'}`}>
          {/* ======================================================== */}
          {/* LEFT SIDEBAR (Dark #202123 matching reference screenshot) */}
          {/* ======================================================== */}
          <div class={`w-[260px] h-full flex flex-col justify-between shrink-0 select-none ${isDark ? 'bg-chatgpt-darkSidebar text-gray-200 border-r border-[#2A2B32]' : 'bg-chatgpt-lightSidebar text-gray-800 border-r border-chatgpt-lightBorder'}`}>
            {/* Top Section */}
            <div class="p-2 flex flex-col h-[calc(100%-140px)]">
              {/* + New chat button */}
              <button
                onClick={handleNewChat}
                class={`flex items-center gap-3 w-full rounded-md px-3 py-2.5 transition text-sm mb-2 shadow-sm font-normal ${isDark ? 'border border-white/20 text-white hover:bg-gray-500/10' : 'bg-white border border-gray-300 text-gray-800 hover:bg-gray-100'}`}
              >
                <PlusIcon />
                <span>New chat</span>
              </button>

              {/* Chat History List */}
              <div class={`flex-1 overflow-y-auto space-y-4 pr-1 ${isDark ? 'custom-scrollbar custom-scrollbar-dark' : 'custom-scrollbar custom-scrollbar-light'}`}>
                {/* Today Section */}
                <div>
                  <div class="text-[11px] font-semibold text-gray-500 px-3 py-2 tracking-wider">Today</div>
                  <div class="space-y-0.5">
                    {todayChats.length > 0 ? (
                      todayChats.map(conv => (
                        <div
                          key={conv.id}
                          onClick={() => selectConversation(conv)}
                          class={`group flex items-center justify-between px-3 py-2.5 rounded-md cursor-pointer transition text-xs ${activeConvId === conv.id ? (isDark ? 'bg-[#343541] text-white font-medium' : 'bg-gray-200/80 text-gray-900 font-medium') : (isDark ? 'text-gray-200 hover:bg-[#2A2B32]' : 'text-gray-700 hover:bg-gray-100')}`}
                        >
                          <div class="flex items-center gap-2.5 truncate">
                            <MessageIcon />
                            <span class="truncate">{conv.title}</span>
                          </div>
                          <button
                            onClick={(e) => handleDeleteChat(e, conv.id)}
                            class="opacity-0 group-hover:opacity-100 hover:text-red-400 transition p-0.5"
                          >
                            <TrashIcon />
                          </button>
                        </div>
                      ))
                    ) : (
                      <div
                        onClick={handleNewChat}
                        class={`flex items-center gap-2.5 px-3 py-2.5 rounded-md cursor-pointer text-xs ${isDark ? 'text-gray-300 hover:bg-[#2A2B32]' : 'text-gray-600 hover:bg-gray-100'}`}
                      >
                        <MessageIcon />
                        <span>New chat</span>
                      </div>
                    )}
                  </div>
                </div>

                {/* Previous 30 Days Section */}
                <div>
                  <div class="text-[11px] font-semibold text-gray-500 px-3 py-2 tracking-wider">Previous 30 Days</div>
                  <div class="space-y-0.5">
                    {previousChats.map(conv => (
                      <div
                        key={conv.id}
                        onClick={() => selectConversation(conv)}
                        class={`group flex items-center justify-between px-3 py-2.5 rounded-md cursor-pointer transition text-xs ${activeConvId === conv.id ? (isDark ? 'bg-[#343541] text-white font-medium' : 'bg-gray-200/80 text-gray-900 font-medium') : (isDark ? 'text-gray-200 hover:bg-[#2A2B32]' : 'text-gray-700 hover:bg-gray-100')}`}
                      >
                        <div class="flex items-center gap-2.5 truncate">
                          <MessageIcon />
                          <span class="truncate">{conv.title}</span>
                        </div>
                        <button
                          onClick={(e) => handleDeleteChat(e, conv.id)}
                          class="opacity-0 group-hover:opacity-100 hover:text-red-400 transition p-0.5"
                        >
                          <TrashIcon />
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>

            {/* Bottom Controls / User Profile Bar matching screenshot */}
            <div class={`p-2 space-y-0.5 border-t ${isDark ? 'border-white/20 bg-chatgpt-darkSidebar' : 'border-gray-200 bg-chatgpt-lightSidebar'}`}>
              {/* Upgrade to Plus with yellow NEW badge (exact screenshot element) */}
              <div
                onClick={() => { setActiveModalTab("memory"); setShowModal(true); }}
                class={`flex items-center justify-between px-3 py-2 text-xs rounded-md transition cursor-pointer ${isDark ? 'text-gray-200 hover:bg-[#2A2B32]' : 'text-gray-700 hover:bg-gray-200/60'}`}
              >
                <div class="flex items-center gap-3">
                  <UserOutlineIcon />
                  <span class="font-normal text-xs">Upgrade to Plus</span>
                </div>
                <span class="bg-[#FAE69E] text-black font-bold text-[10px] px-1.5 py-0.5 rounded tracking-wider shadow-sm">
                  NEW
                </span>
              </div>

              {/* Files & Knowledge Manager */}
              <div
                onClick={() => { setActiveModalTab("documents"); setShowModal(true); }}
                class={`flex items-center justify-between px-3 py-2 text-xs rounded-md transition cursor-pointer ${isDark ? 'text-gray-200 hover:bg-[#2A2B32]' : 'text-gray-700 hover:bg-gray-200/60'}`}

                <div class="flex items-center gap-3">
                  <FileOutlineIcon />

                </div>
                <span class={`font-mono text-[10px] px-1.5 py-0.5 rounded font-semibold ${isDark ? 'bg-gray-700 text-gray-200' : 'bg-gray-200 text-gray-700'}`}>
                  {uploadedDocs.length}
                </span>
              </div>

              {/* Theme Toggle (Dark / Light) */}
              <div
                onClick={toggleTheme}
                class={`flex items-center justify-between px-3 py-2 text-xs rounded-md transition cursor-pointer ${isDark ? 'text-gray-200 hover:bg-[#2A2B32]' : 'text-gray-700 hover:bg-gray-200/60'}`}
              >
                <div class="flex items-center gap-3">
                  {isDark ? <SunIcon /> : <MoonIcon />}
                  <span class="font-normal text-xs">{isDark ? "Light mode" : "Dark mode"}</span>
                </div>
                <span class={`text-[10px] font-mono px-1.5 py-0.5 rounded uppercase ${isDark ? 'bg-gray-700 text-gray-300' : 'bg-gray-200 text-gray-600'}`}>
                  {theme}
                </span>
              </div>

              {/* User Profile Row: Avatar + Email + 3-dots */}
              <div
                onClick={() => { setActiveModalTab("user"); setShowModal(true); }}
                class={`flex items-center justify-between px-3 py-2 text-xs rounded-md transition cursor-pointer ${isDark ? 'text-gray-200 hover:bg-[#2A2B32]' : 'text-gray-700 hover:bg-gray-200/60'}`}
              >
                <div class="flex items-center gap-2.5 truncate">
                  <UserAvatar email={userEmail} />
                  <span class="truncate font-normal text-xs">{userEmail}</span>
                </div>
                <span class="text-gray-400 hover:text-white text-sm font-bold tracking-widest pl-1">•••</span>
              </div>
            </div>
          </div>

          {/* ======================================================== */}
          {/* MAIN CHAT AREA (Dark #343541 matching reference screen)   */}
          {/* ======================================================== */}
          <div class={`flex-1 flex flex-col h-full relative overflow-hidden ${isDark ? 'bg-chatgpt-darkCanvas text-chatgpt-darkText' : 'bg-chatgpt-lightCanvas text-chatgpt-lightText'}`}>
            {/* Conversation Flow or Empty Home Screen */}
            <div class={`flex-1 overflow-y-auto flex flex-col justify-between ${isDark ? 'custom-scrollbar custom-scrollbar-dark' : 'custom-scrollbar custom-scrollbar-light'}`}>
              {messages.length === 0 ? (
                /* EMPTY STATE: Exactly matching screenshot with 3 columns */
                <div class="max-w-3xl w-full mx-auto px-4 pt-16 pb-32 flex flex-col items-center justify-center my-auto">
                  {/* ChatGPT Center Title */}
                  <h1 class={`text-[36px] font-semibold mb-10 tracking-tight select-none ${isDark ? 'text-white' : 'text-gray-900'}`}>
                    ChatGPT
                  </h1>

                  {/* 3 Columns: Examples, Capabilities, Limitations */}
                  <div class="grid grid-cols-1 md:grid-cols-3 gap-3.5 w-full text-center">
                    {/* 1. Examples Column */}
                    <div class="flex flex-col gap-3.5">
                      <div class="flex flex-col items-center justify-center mb-1">
                        <SunIcon />
                        <h2 class={`text-base font-normal ${isDark ? 'text-[#ECECF1]' : 'text-gray-900'}`}>Examples</h2>
                      </div>
                      <button
                        onClick={() => handleSend("Explain quantum computing in simple terms")}
                        class={`p-3.5 rounded-md text-xs transition shadow-sm select-none min-h-[64px] flex items-center justify-center active:scale-[0.98] ${isDark ? 'bg-chatgpt-darkCard hover:bg-chatgpt-darkCardHover text-chatgpt-darkText' : 'bg-chatgpt-lightCard hover:bg-chatgpt-lightCardHover text-chatgpt-lightText border border-gray-200'}`}
                      >
                        "Explain quantum computing in simple terms" →
                      </button>
                      <button
                        onClick={() => handleSend("Got any creative ideas for a 10 year old's birthday?")}
                        class={`p-3.5 rounded-md text-xs transition shadow-sm select-none min-h-[64px] flex items-center justify-center active:scale-[0.98] ${isDark ? 'bg-chatgpt-darkCard hover:bg-chatgpt-darkCardHover text-chatgpt-darkText' : 'bg-chatgpt-lightCard hover:bg-chatgpt-lightCardHover text-chatgpt-lightText border border-gray-200'}`}
                      >
                        "Got any creative ideas for a 10 year old's birthday?" →
                      </button>
                      <button
                        onClick={() => handleSend("How do I make an HTTP request in Javascript?")}
                        class={`p-3.5 rounded-md text-xs transition shadow-sm select-none min-h-[64px] flex items-center justify-center active:scale-[0.98] ${isDark ? 'bg-chatgpt-darkCard hover:bg-chatgpt-darkCardHover text-chatgpt-darkText' : 'bg-chatgpt-lightCard hover:bg-chatgpt-lightCardHover text-chatgpt-lightText border border-gray-200'}`}
                      >
                        "How do I make an HTTP request in Javascript?" →
                      </button>
                    </div>

                    {/* 2. Capabilities Column */}
                    <div class="flex flex-col gap-3.5">
                      <div class="flex flex-col items-center justify-center mb-1">
                        <BoltIcon />
                        <h2 class={`text-base font-normal ${isDark ? 'text-[#ECECF1]' : 'text-gray-900'}`}>Capabilities</h2>
                      </div>
                      <div class={`p-3.5 rounded-md text-xs shadow-sm select-none min-h-[64px] flex items-center justify-center ${isDark ? 'bg-chatgpt-darkCard text-chatgpt-darkText' : 'bg-chatgpt-lightCard text-chatgpt-lightText border border-gray-200'}`}>
                        Remembers what user said earlier in the conversation
                      </div>
                      <div class={`p-3.5 rounded-md text-xs shadow-sm select-none min-h-[64px] flex items-center justify-center ${isDark ? 'bg-chatgpt-darkCard text-chatgpt-darkText' : 'bg-chatgpt-lightCard text-chatgpt-lightText border border-gray-200'}`}>
                        Allows user to provide follow-up corrections
                      </div>
                      <div class={`p-3.5 rounded-md text-xs shadow-sm select-none min-h-[64px] flex items-center justify-center ${isDark ? 'bg-chatgpt-darkCard text-chatgpt-darkText' : 'bg-chatgpt-lightCard text-chatgpt-lightText border border-gray-200'}`}>
                        Trained to decline inappropriate requests
                      </div>
                    </div>

                    {/* 3. Limitations Column */}
                    <div class="flex flex-col gap-3.5">
                      <div class="flex flex-col items-center justify-center mb-1">
                        <WarningIcon />
                        <h2 class={`text-base font-normal ${isDark ? 'text-[#ECECF1]' : 'text-gray-900'}`}>Limitations</h2>
                      </div>
                      <div class={`p-3.5 rounded-md text-xs shadow-sm select-none min-h-[64px] flex items-center justify-center ${isDark ? 'bg-chatgpt-darkCard text-chatgpt-darkText' : 'bg-chatgpt-lightCard text-chatgpt-lightText border border-gray-200'}`}>
                        May occasionally generate incorrect information
                      </div>
                      <div class={`p-3.5 rounded-md text-xs shadow-sm select-none min-h-[64px] flex items-center justify-center ${isDark ? 'bg-chatgpt-darkCard text-chatgpt-darkText' : 'bg-chatgpt-lightCard text-chatgpt-lightText border border-gray-200'}`}>
                        May occasionally produce harmful instructions or biased content
                      </div>
                      <div class={`p-3.5 rounded-md text-xs shadow-sm select-none min-h-[64px] flex items-center justify-center ${isDark ? 'bg-chatgpt-darkCard text-chatgpt-darkText' : 'bg-chatgpt-lightCard text-chatgpt-lightText border border-gray-200'}`}>
                        Limited knowledge of world and events after 2021
                      </div>
                    </div>
                  </div>
                </div>
              ) : (
                /* ======================================================== */
                /* ACTIVE CHAT: USER QUERY (RIGHT) & BOT RESPONSE (LEFT)    */
                /* ======================================================== */
                <div class="max-w-3xl w-full mx-auto px-4 py-8 space-y-6 pb-40">
                  {messages.map((m, idx) => {
                    const isAssistant = m.role === 'assistant';

                    if (!isAssistant) {
                      // 1. USER QUERY: ALIGNED TO THE RIGHT
                      return (
                        <div key={idx} class="flex justify-end w-full animate-in fade-in duration-150">
                          <div class={`max-w-[85%] md:max-w-[72%] px-5 py-3.5 rounded-3xl shadow-sm text-[15px] leading-relaxed break-words whitespace-pre-wrap select-text font-normal ${isDark ? 'bg-chatgpt-darkUserBubble text-white border border-gray-700/60' : 'bg-chatgpt-lightUserBubble text-gray-900 border border-gray-200'}`}>
                            {m.content}
                          </div>
                        </div>
                      );
                    }

                    // 2. BOT RESPONSE: ALIGNED TO THE LEFT
                    return (
                      <div key={idx} class="flex justify-start w-full gap-4 animate-in fade-in duration-200">
                        {/* Assistant Avatar on Left */}
                        <div class="shrink-0 mt-1">
                          <AssistantAvatar />
                        </div>

                        {/* Assistant Response Body on Left */}
                        <div class="flex-1 max-w-[92%] overflow-hidden space-y-3">
                          {/* Markdown Rendered Content without emoji stickers */}
                          <div
                            class={`prose max-w-none leading-relaxed text-[15px] select-text ${isDark ? 'prose-dark' : 'prose-light'}`}
                            dangerouslySetInnerHTML={{ __html: marked.parse(m.content || '') }}
                          />

                          {/* Citations List if available */}
                          {m.metadata && m.metadata.citations && m.metadata.citations.length > 0 && (
                            <div class={`mt-3 text-xs space-y-1.5 p-3.5 rounded-lg border ${isDark ? 'bg-[#2A2B32] border-gray-700 text-gray-300' : 'bg-gray-50 border-gray-200 text-gray-600'}`}>
                              <div class={`font-semibold text-[11px] ${isDark ? 'text-gray-200' : 'text-gray-800'}`}>
                                Verified Sources & References:
                              </div>
                              {m.metadata.citations.map((c, i) => (
                                <div key={i} class="truncate flex items-center gap-2">
                                  <span class="text-emerald-500 font-mono font-medium text-[11px]">[{i+1}]</span>{' '}
                                  <a href={c.url} target="_blank" rel="noopener noreferrer" class="hover:underline font-medium truncate text-emerald-400">

                                  </a>
                                  {c.domain && (
                                    <span class="text-[10px] text-gray-400 font-mono">({c.domain})</span>
                                  )}
                                </div>
                              ))}

                          )}

                          {/* Attribution Badges & Action Buttons */}
                          <div class={`pt-2 flex flex-wrap items-center justify-between gap-2 border-t mt-2 ${isDark ? 'border-gray-700/60' : 'border-gray-100'}`}>
                            <div class="flex flex-wrap items-center gap-1.5">
                              {m.metadata?.category && (
                                <span class={`text-[10px] px-2 py-0.5 rounded-full font-medium border ${isDark ? 'bg-sky-950/60 text-sky-400 border-sky-800' : 'bg-sky-50 text-sky-700 border-sky-200'}`}>
                                  {m.metadata.category}
                                </span>
                              )}
                              {m.metadata?.agents_used && m.metadata.agents_used.map(ag => (
                                <span key={ag} class={`text-[10px] px-2 py-0.5 rounded-full font-medium border ${isDark ? 'bg-emerald-950/60 text-emerald-400 border-emerald-800' : 'bg-emerald-50 text-emerald-700 border-emerald-200'}`}>
                                  agent: {ag}
                                </span>
                              ))}
                            </div>

                            {/* Copy button */}
                            <button
                              onClick={() => copyToClipboard(m.content, idx)}
                              class={`transition p-1.5 rounded text-xs flex items-center gap-1 select-none ${isDark ? 'text-gray-400 hover:text-white hover:bg-gray-700' : 'text-gray-400 hover:text-gray-800 hover:bg-gray-100'}`}
                              title="Copy response"
                            >
                              {copiedIndex === idx ? (
                                <span class="text-emerald-400 text-xs font-medium">Copied</span>
                              ) : (
                                <CopyIcon />
                              )}
                            </button>
                          </div>
                        </div>
                      </div>

                  })}

                  {/* Generating State on the Left */}
                  {isLoading && (
                    <div class="flex justify-start w-full gap-4 animate-in fade-in duration-150">
                      <div class="shrink-0 mt-1">
                        <AssistantAvatar />
                      </div>
                      <div class="flex items-center gap-2 text-xs py-2">
                        <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>

                        <span class="cursor-blink"></span>
                      </div>
                    </div>

                </div>

            {/* ======================================================== */}
            {/* FLOATING BOTTOM INPUT BAR                                */}
            {/* ======================================================== */}
            <div class={`absolute bottom-0 left-0 w-full pt-6 pb-4 px-4 ${isDark ? 'bg-gradient-to-t from-chatgpt-darkCanvas via-chatgpt-darkCanvas to-transparent' : 'bg-gradient-to-t from-white via-white to-transparent'}`}>
              <div class="max-w-3xl mx-auto">
                {/* Attached File Chip without emoji sticker */}
                {attachedFile && (
                  <div class={`mb-2 flex items-center justify-between rounded-lg px-3 py-2 text-xs shadow-sm animate-in fade-in duration-150 border ${isDark ? 'bg-[#2A2B32] border-gray-700 text-white' : 'bg-gray-50 border-gray-200 text-gray-800'}`}>

                          <span class="inline-block w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>

                      )}
                      {uploadSuccessMsg && (
                        <span class="text-emerald-400 text-[11px] font-medium ml-2">Indexed</span>
                      )}
                    </div>
                    <button
                      onClick={() => setAttachedFile(null)}
                      class="text-gray-400 hover:text-white p-1 rounded"
                    >
                      ✕
                    </button>
                  </div>
                )}

                <form
                  onSubmit={(e) => { e.preventDefault(); handleSend(); }}
                  class={`relative flex items-center rounded-xl overflow-hidden transition pl-2 border shadow-lg ${isDark ? 'bg-chatgpt-darkInput border-black/20 shadow-[0_0_15px_rgba(0,0,0,0.25)] focus-within:border-gray-500' : 'bg-white border-gray-300 shadow-[0_0_15px_rgba(0,0,0,0.06)] focus-within:border-gray-500'}`}
                >
                  {/* Hidden File Input & Paperclip Attachment Button */}
                  <input
                    type="file"
                    ref={fileInputRef}
                    onChange={handleFileUpload}
                    accept=".pdf,.docx,.pptx,.doc,.txt,.md,.json,.csv,.py,.html"
                    class="hidden"
                  />
                  <button
                    type="button"
                    onClick={() => fileInputRef.current?.click()}
                    disabled={isUploading}
                    class={`p-2 transition rounded-lg disabled:opacity-40 ${isDark ? 'text-gray-400 hover:text-white hover:bg-gray-700' : 'text-gray-500 hover:text-gray-900 hover:bg-gray-100'}`}
                    title="Attach document (PDF, Word, Text, CSV)"
                  >
                    <PaperclipIcon />
                  </button>

                  <input
                    type="text"
                    value={inputQuery}
                    onChange={(e) => setInputQuery(e.target.value)}
                    placeholder="Send a message."
                    class={`w-full bg-transparent px-3 py-3.5 pr-12 text-sm focus:outline-none ${isDark ? 'text-white placeholder-[#8E8EA0]' : 'text-gray-900 placeholder-gray-400'}`}
                  />
                  <button
                    type="submit"
                    disabled={!inputQuery.trim() || isLoading}
                    class={`absolute right-3 p-1.5 rounded-lg disabled:opacity-30 disabled:hover:bg-transparent transition cursor-pointer ${isDark ? 'hover:bg-gray-700' : 'hover:bg-gray-100'}`}
                  >
                    <SendIcon active={!!inputQuery.trim()} isDark={isDark} />
                  </button>
                </form>

                {/* Footer disclaimer matching reference screenshot */}
                <div class={`text-[11px] text-center mt-2 select-none ${isDark ? 'text-[#C5C5D2]' : 'text-gray-400'}`}>
                  Free Research Preview. ChatGPT may produce inaccurate information about people, places, or facts.{' '}
                  <span
                    onClick={() => { setActiveModalTab("documents"); setShowModal(true); }}
                    class="underline cursor-pointer hover:opacity-80"
                  >
                    ChatGPT May 12 Version
                  </span>
                </div>
              </div>
            </div>
          </div>

          {/* ======================================================== */}
          {/* PLUS / MEMORY / DOCUMENTS SETTINGS MODAL                 */}
          {/* ======================================================== */}
          {showModal && (
            <div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-in fade-in duration-150">
              <div class={`border rounded-xl w-full max-w-2xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden ${isDark ? 'bg-[#202123] border-gray-700 text-gray-200' : 'bg-white border-gray-200 text-gray-800'}`}>
                {/* Modal Header */}
                <div class={`p-4 border-b flex items-center justify-between ${isDark ? 'bg-[#2A2B32] border-gray-700' : 'bg-gray-50 border-gray-200'}`}>
                  <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-[#10A37F] text-white flex items-center justify-center shadow-sm">
                      <OpenAIIcon />
                    </div>
                    <div>
                      <h3 class={`font-semibold text-sm ${isDark ? 'text-white' : 'text-gray-900'}`}>ChatGPT Multi-Agent Knowledge System</h3>
                      <div class={`text-[11px] ${isDark ? 'text-gray-400' : 'text-gray-500'}`}>Document Ingestion, LangGraph Orchestration & Memory</div>
                    </div>
                  </div>
                  <button onClick={() => setShowModal(false)} class="text-gray-400 hover:text-white text-lg px-2">✕</button>
                </div>

                {/* Modal Navigation Tabs */}
                <div class={`flex border-b px-4 ${isDark ? 'bg-[#2A2B32] border-gray-700' : 'bg-gray-50 border-gray-200'}`}>
                  <button
                    onClick={() => setActiveModalTab("documents")}
                    class={`py-2.5 px-3 text-xs font-medium border-b-2 transition ${activeModalTab === "documents" ? "border-emerald-500 text-emerald-400" : "border-transparent text-gray-400 hover:text-gray-200"}`}
                  >
                    Ingested Documents ({uploadedDocs.length})
                  </button>
                  <button
                    onClick={() => setActiveModalTab("memory")}
                    class={`py-2.5 px-3 text-xs font-medium border-b-2 transition ${activeModalTab === "memory" ? "border-emerald-500 text-emerald-400" : "border-transparent text-gray-400 hover:text-gray-200"}`}
                  >
                    Long-Term Memory ({memories.length})
                  </button>
                  <button
                    onClick={() => setActiveModalTab("agents")}
                    class={`py-2.5 px-3 text-xs font-medium border-b-2 transition ${activeModalTab === "agents" ? "border-emerald-500 text-emerald-400" : "border-transparent text-gray-400 hover:text-gray-200"}`}
                  >
                    Multi-Agent Graph
                  </button>
                  <button
                    onClick={() => setActiveModalTab("user")}
                    class={`py-2.5 px-3 text-xs font-medium border-b-2 transition ${activeModalTab === "user" ? "border-emerald-500 text-emerald-400" : "border-transparent text-gray-400 hover:text-gray-200"}`}
                  >
                    User & Profile
                  </button>
                </div>

                {/* Modal Body */}
                <div class={`p-5 overflow-y-auto flex-1 space-y-4 ${isDark ? 'bg-[#202123] custom-scrollbar custom-scrollbar-dark' : 'bg-white custom-scrollbar custom-scrollbar-light'}`}>
                  {/* TAB 1: Ingested Documents */}
                  {activeModalTab === "documents" && (
                    <div class="space-y-4">
                      {/* Document Upload Zone */}
                      <div class={`border-2 border-dashed rounded-xl p-5 text-center transition ${isDark ? 'border-gray-700 hover:border-emerald-500 bg-[#2A2B32]' : 'border-gray-300 hover:border-emerald-500 bg-gray-50'}`}>
                        <input
                          type="file"
                          ref={modalFileInputRef}
                          onChange={handleFileUpload}
                          accept=".pdf,.docx,.pptx,.doc,.txt,.md,.json,.csv,.py,.html"
                          class="hidden"
                        />
                        <div class="flex justify-center mb-2 text-gray-400">
                          <FileOutlineIcon />
                        </div>
                        <div class={`text-xs font-semibold mb-1 ${isDark ? 'text-white' : 'text-gray-900'}`}>
                          Upload Document into Knowledge Base
                        </div>
                        <div class={`text-[11px] mb-3 ${isDark ? 'text-gray-400' : 'text-gray-500'}`}>
                          Supports PDF, DOCX, PPTX, TXT, MD, CSV, JSON, and HTML. Files are chunked and embedded in Qdrant.
                        </div>
                        <button
                          type="button"
                          onClick={() => modalFileInputRef.current?.click()}
                          disabled={isUploading}
                          class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 py-2 rounded-lg font-medium transition inline-flex items-center gap-2 shadow-sm"
                        >
                          <PaperclipIcon />
                          <span>{isUploading ? "Indexing into Qdrant..." : "Choose File to Ingest"}</span>
                        </button>
                      </div>

                      {/* Uploaded Documents List */}
                      <div class="space-y-2">
                        <div class={`font-semibold text-xs ${isDark ? 'text-gray-300' : 'text-gray-700'}`}>Indexed Documents ({uploadedDocs.length})</div>
                        {uploadedDocs.map(doc => (
                          <div key={doc.id} class={`border rounded-lg p-3 flex items-center justify-between ${isDark ? 'bg-[#2A2B32] border-gray-700' : 'bg-gray-50 border-gray-200'}`}>
                            <div class="flex items-center gap-3 truncate">
                              <FileOutlineIcon />
                              <div class="truncate">
                                <div class={`text-xs font-medium truncate ${isDark ? 'text-white' : 'text-gray-900'}`}>{doc.file_name}</div>
                                <div class="text-[10px] text-gray-400 flex items-center gap-2 mt-0.5">
                                  <span class="uppercase bg-gray-700 text-gray-200 px-1 rounded">{doc.file_type}</span>
                                  <span>{(doc.file_size / 1024).toFixed(1)} KB</span>
                                  <span class="text-emerald-400 font-mono font-medium">{doc.chunks_count} chunks indexed</span>
                                </div>
                              </div>
                            </div>
                            <button
                              onClick={() => handleDeleteDoc(doc.id)}
                              class="text-gray-400 hover:text-red-400 text-xs px-2 py-1 rounded transition"
                              title="Delete document"
                            >
                              <TrashIcon />
                            </button>
                          </div>
                        ))}
                        {uploadedDocs.length === 0 && (
                          <div class={`text-xs italic p-4 text-center border border-dashed rounded-lg ${isDark ? 'text-gray-400 border-gray-700' : 'text-gray-500 border-gray-200'}`}>
                            No custom documents uploaded yet. Ingest any file using the button above or the paperclip in the chat input.
                          </div>
                        )}
                      </div>
                    </div>
                  )}

                  {/* TAB 2: Long-Term Memory */}
                  {activeModalTab === "memory" && (
                    <div class="space-y-4">
                      {/* Explicit Memory Form */}
                      <form onSubmit={handleSaveMemory} class={`border rounded-lg p-3 space-y-3 ${isDark ? 'bg-[#2A2B32] border-gray-700' : 'bg-gray-50 border-gray-200'}`}>
                        <div class={`font-semibold text-xs ${isDark ? 'text-white' : 'text-gray-900'}`}>Save Explicit Memory</div>
                        <div class="grid grid-cols-2 gap-2">
                          <div>
                            <label class={`text-[10px] ${isDark ? 'text-gray-400' : 'text-gray-600'}`}>Category</label>
                            <select
                              value={newMemCategory}
                              onChange={(e) => setNewMemCategory(e.target.value)}
                              class={`w-full border rounded px-2 py-1.5 text-xs mt-0.5 focus:outline-none ${isDark ? 'bg-[#202123] border-gray-600 text-white' : 'bg-white border-gray-300 text-gray-900'}`}
                            >
                              <option value="user_preferences">User Preferences</option>
                              <option value="user_context">User Context</option>
                              <option value="project_context">Project Context</option>
                              <option value="research_memory">Research Memory</option>
                              <option value="explicit_notes">Explicit Notes</option>
                            </select>
                          </div>
                          <div>
                            <label class={`text-[10px] ${isDark ? 'text-gray-400' : 'text-gray-600'}`}>Importance (1-5)</label>
                            <input
                              type="number"
                              min="1"
                              max="5"
                              value={newMemImp}
                              onChange={(e) => setNewMemImp(e.target.value)}
                              class={`w-full border rounded px-2 py-1.5 text-xs mt-0.5 focus:outline-none ${isDark ? 'bg-[#202123] border-gray-600 text-white' : 'bg-white border-gray-300 text-gray-900'}`}
                            />
                          </div>
                        </div>
                        <div>
                          <label class={`text-[10px] ${isDark ? 'text-gray-400' : 'text-gray-600'}`}>Content (No passwords or API keys)</label>
                          <textarea
                            rows="2"
                            placeholder="e.g. User prefers concise answers with clean unadorned code snippets."
                            value={newMemContent}
                            onChange={(e) => setNewMemContent(e.target.value)}
                            class={`w-full border rounded px-2.5 py-1.5 text-xs mt-0.5 focus:outline-none ${isDark ? 'bg-[#202123] border-gray-600 text-white' : 'bg-white border-gray-300 text-gray-900'}`}
                          />
                        </div>
                        <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3.5 py-1.5 rounded font-medium transition shadow-sm">
                          Save Memory
                        </button>
                      </form>

                      {/* Stored Memories List */}
                      <div class="space-y-2">
                        <div class={`font-semibold text-xs ${isDark ? 'text-gray-300' : 'text-gray-700'}`}>Active Long-Term Memories ({memories.length})</div>
                        {memories.map(mem => (
                          <div key={mem.id} class={`border rounded-lg p-3 flex items-start justify-between ${isDark ? 'bg-[#2A2B32] border-gray-700' : 'bg-gray-50 border-gray-200'}`}>
                            <div class="space-y-1 pr-2">
                              <div class="flex items-center gap-2">
                                <span class={`text-[10px] border px-2 py-0.5 rounded font-medium ${isDark ? 'bg-amber-950/60 text-amber-300 border-amber-800' : 'bg-amber-50 text-amber-700 border-amber-200'}`}>
                                  {mem.category.replace('_', ' ').toUpperCase()}
                                </span>
                                <span class="text-[10px] text-gray-400">Importance: {mem.importance}/5</span>
                              </div>
                              <div class={`text-xs ${isDark ? 'text-gray-200' : 'text-gray-800'}`}>{mem.content}</div>
                            </div>
                            <button
                              onClick={() => handleDeleteMemory(mem.id)}
                              class="text-gray-400 hover:text-red-400 text-xs px-2 py-1 rounded transition"
                            >
                              ✕
                            </button>
                          </div>
                        ))}
                        {memories.length === 0 && (
                          <div class={`text-xs italic p-4 text-center border border-dashed rounded-lg ${isDark ? 'text-gray-400 border-gray-700' : 'text-gray-500 border-gray-200'}`}>
                            No persistent memories yet. The system automatically extracts key preferences, or you can add them above.
                          </div>
                        )}
                      </div>
                    </div>
                  )}

                  {/* TAB 3: Multi-Agent System */}
                  {activeModalTab === "agents" && (
                    <div class="space-y-3 text-xs">
                      <div class={`p-3 border rounded-lg space-y-2 ${isDark ? 'bg-[#2A2B32] border-gray-700' : 'bg-gray-50 border-gray-200'}`}>
                        <div class={`font-semibold ${isDark ? 'text-white' : 'text-gray-900'}`}>LangGraph Orchestration Pipeline</div>
                        <p class={`text-[11px] leading-relaxed ${isDark ? 'text-gray-400' : 'text-gray-600'}`}>
                          Incoming queries are routed by the Supervisor node to specialized agents via conditional StateGraph routing and merged into shared state.
                        </p>
                      </div>
                      <div class="grid grid-cols-2 gap-2">
                        <div class={`p-3 border rounded-lg ${isDark ? 'bg-[#2A2B32] border-gray-700' : 'bg-gray-50 border-gray-200'}`}>
                          <div class={`font-semibold ${isDark ? 'text-white' : 'text-gray-900'}`}>1. Supervisor Agent</div>
                          <div class={`text-[11px] ${isDark ? 'text-gray-400' : 'text-gray-600'}`}>Intent detection and parallel dispatch</div>
                        </div>
                        <div class={`p-3 border rounded-lg ${isDark ? 'bg-[#2A2B32] border-gray-700' : 'bg-gray-50 border-gray-200'}`}>
                          <div class={`font-semibold ${isDark ? 'text-white' : 'text-gray-900'}`}>2. RAG Agent</div>
                          <div class={`text-[11px] ${isDark ? 'text-gray-400' : 'text-gray-600'}`}>Qdrant Cloud vector search and FlashRank reranker</div>
                        </div>
                        <div class={`p-3 border rounded-lg ${isDark ? 'bg-[#2A2B32] border-gray-700' : 'bg-gray-50 border-gray-200'}`}>
                          <div class={`font-semibold ${isDark ? 'text-white' : 'text-gray-900'}`}>3. Web Search Agent</div>
                          <div class={`text-[11px] ${isDark ? 'text-gray-400' : 'text-gray-600'}`}>Tavily Search API and DuckDuckGo fallback</div>
                        </div>
                        <div class={`p-3 border rounded-lg ${isDark ? 'bg-[#2A2B32] border-gray-700' : 'bg-gray-50 border-gray-200'}`}>
                          <div class={`font-semibold ${isDark ? 'text-white' : 'text-gray-900'}`}>4. Research Agent</div>
                          <div class={`text-[11px] ${isDark ? 'text-gray-400' : 'text-gray-600'}`}>Evidence synthesis and multi-source cross-check</div>
                        </div>
                        <div class={`p-3 border rounded-lg ${isDark ? 'bg-[#2A2B32] border-gray-700' : 'bg-gray-50 border-gray-200'}`}>
                          <div class={`font-semibold ${isDark ? 'text-white' : 'text-gray-900'}`}>5. Tool Agent</div>
                          <div class={`text-[11px] ${isDark ? 'text-gray-400' : 'text-gray-600'}`}>Calculator, Python executor, and date utilities</div>
                        </div>
                        <div class={`p-3 border rounded-lg ${isDark ? 'bg-[#2A2B32] border-gray-700' : 'bg-gray-50 border-gray-200'}`}>
                          <div class={`font-semibold ${isDark ? 'text-white' : 'text-gray-900'}`}>6. Response Agent</div>
                          <div class={`text-[11px] ${isDark ? 'text-gray-400' : 'text-gray-600'}`}>Grounded synthesis with verified citations</div>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* TAB 4: User & Profile */}
                  {activeModalTab === "user" && (
                    <div class="space-y-4 text-xs">
                      <div class={`p-3 border rounded-lg space-y-3 ${isDark ? 'bg-[#2A2B32] border-gray-700' : 'bg-gray-50 border-gray-200'}`}>
                        <div class={`font-semibold ${isDark ? 'text-white' : 'text-gray-900'}`}>User Identification & Isolation</div>
                        <div>
                          <label class={`text-[10px] ${isDark ? 'text-gray-400' : 'text-gray-600'}`}>Display Email</label>
                          <input
                            type="text"
                            value={userEmail}
                            onChange={(e) => setUserEmail(e.target.value)}
                            class={`w-full border rounded px-2.5 py-1.5 text-xs mt-1 ${isDark ? 'bg-[#202123] border-gray-600 text-white' : 'bg-white border-gray-300 text-gray-900'}`}
                          />
                        </div>
                        <div>
                          <label class={`text-[10px] ${isDark ? 'text-gray-400' : 'text-gray-600'}`}>Database User ID (Isolation key)</label>
                          <input
                            type="text"
                            value={userId}
                            onChange={(e) => setUserId(e.target.value)}
                            class={`w-full border rounded px-2.5 py-1.5 text-xs mt-1 ${isDark ? 'bg-[#202123] border-gray-600 text-white' : 'bg-white border-gray-300 text-gray-900'}`}
                          />
                        </div>
                      </div>
                      <div class={`p-3 border rounded-lg space-y-2 ${isDark ? 'bg-[#2A2B32] border-gray-700' : 'bg-gray-50 border-gray-200'}`}>
                        <div class={`font-semibold ${isDark ? 'text-white' : 'text-gray-900'}`}>Data Retention & Control</div>
                        <p class={`text-[11px] ${isDark ? 'text-gray-400' : 'text-gray-600'}`}>
                          All messages, documents, and memories are stored locally in SQLite (`processed_data/memory.db`) or PostgreSQL (`DATABASE_URL`). You can delete individual memories or chats anytime.
                        </p>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
